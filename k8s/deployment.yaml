apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-app
  labels:
    app: procurement-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: procurement-app
  template:
    metadata:
      labels:
        app: procurement-app
        tier: frontend
    spec:
      containers:
        - name: procurement-container
          image: abaancc/devops-24eskcs008:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
