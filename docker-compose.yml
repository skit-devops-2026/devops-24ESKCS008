services:
  procurement-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: abaancc/devops-24eskcs008:latest
    container_name: procurement-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
